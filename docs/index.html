<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>마이 루틴 랩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&family=Gothic+A1:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#e9ebee; --app:#f6f6f8; --paper:#ffffff; --ink:#1b1b24; --ink2:#4d4b59; --muted:#8a8796;
  --line:#e6e3ec; --plum:#4a2c5c; --plum-ink:#ffffff; --lilac:#ece4f3; --mint:#d6ece6; --sunk:#f0eef4;
  --c-hyd:#4f86c6; --c-calm:#3aa58b; --c-pig:#c99a3a; --c-age:#7a5bb5; --c-seb:#c9668e;
  --warn:#7c5713; --warn-bg:#f6eedd; --shadow:0 24px 60px rgba(40,24,56,.14);
  --orb1:#efe3f6; --orb2:#d7efe8; --orb3:#fbe9ee;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c0b10; --app:#14121a; --paper:#1c1924; --ink:#efecf4; --ink2:#c2bccd; --muted:#8f889c;
    --line:#2c2836; --plum:#c9a7e0; --plum-ink:#16121c; --lilac:#2c2338; --mint:#1d322d; --sunk:#191620;
    --c-hyd:#6aa1e0; --c-calm:#4fc0a3; --c-pig:#dcb15a; --c-age:#a68be0; --c-seb:#e08aae;
    --warn:#e6bd6a; --warn-bg:#352a17; --shadow:0 24px 60px rgba(0,0,0,.5);
    --orb1:#3a2a4a; --orb2:#1f3b35; --orb3:#3d2430;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0b10; --app:#14121a; --paper:#1c1924; --ink:#efecf4; --ink2:#c2bccd; --muted:#8f889c;
  --line:#2c2836; --plum:#c9a7e0; --plum-ink:#16121c; --lilac:#2c2338; --mint:#1d322d; --sunk:#191620;
  --c-hyd:#6aa1e0; --c-calm:#4fc0a3; --c-pig:#dcb15a; --c-age:#a68be0; --c-seb:#e08aae;
  --warn:#e6bd6a; --warn-bg:#352a17; --shadow:0 24px 60px rgba(0,0,0,.5);
  --orb1:#3a2a4a; --orb2:#1f3b35; --orb3:#3d2430;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;font-weight:400;line-height:1.65;word-break:keep-all;padding-inline:16px;padding-block:24px;-webkit-font-smoothing:antialiased}
.serif{font-family:"Hahmlet","Gowun Batang",serif}
.phone{max-width:420px;margin:0 auto;min-height:100%;background:var(--app);border-radius:34px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (max-width:480px){ body{padding-inline:0;padding-block:0} .phone{border-radius:0;box-shadow:none} }
.top{display:flex;align-items:center;gap:14px;padding:20px 22px 6px}
.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.back[aria-hidden="true"]{visibility:hidden}
.dots{flex:1;display:flex;gap:5px}
.dots i{flex:1;height:4px;border-radius:99px;background:var(--line);transition:background .3s}
.dots i.on{background:var(--plum)}
main{flex:1;display:flex;flex-direction:column;padding:14px 22px 26px;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:"Hahmlet",serif;font-weight:600;font-size:36px;line-height:1.22;letter-spacing:-.02em}
h2{font-family:"Hahmlet",serif;font-weight:600;font-size:25px;line-height:1.35;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600}
p{margin:0}
.kicker{font-size:11.5px;letter-spacing:.22em;color:var(--plum);font-weight:600;text-transform:uppercase}
.lead{color:var(--ink2);font-size:15px;font-weight:300}
.qnum{font-family:"Hahmlet",serif;font-size:14px;color:var(--plum);font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:17px 18px;cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
.opt:active{transform:scale(.985)}
.opt b{font-size:16px;font-weight:500;flex:1}
.opt .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;transition:all .2s}
.opt[aria-pressed="true"]{border-color:var(--plum);background:var(--lilac)}
.opt[aria-pressed="true"] .ck{background:var(--plum);border-color:var(--plum)}
.opt[aria-pressed="true"] .ck::after{content:"";width:8px;height:5px;border-left:2px solid var(--plum-ink);border-bottom:2px solid var(--plum-ink);transform:rotate(-45deg) translate(1px,-1px)}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible,.seg button:focus-visible,.skin:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.btn{font:inherit;font-weight:600;font-size:16px;border-radius:99px;padding:17px;border:0;background:var(--plum);color:var(--plum-ink);cursor:pointer;width:100%;letter-spacing:.01em}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:8px}
.note{font-size:12.5px;color:var(--muted);font-weight:300}
.field{display:flex;flex-direction:column;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px}
.field label,.field .lab{font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
.agebox{display:flex;align-items:baseline;gap:6px}
.agebox output{font-family:"Hahmlet",serif;font-size:46px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.agebox small{font-size:15px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--plum)}
.seg{display:flex;gap:8px;background:var(--sunk);padding:5px;border-radius:99px}
.seg button{flex:1;font:inherit;font-weight:500;padding:12px;border-radius:99px;border:0;background:transparent;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 2px 8px rgba(40,24,56,.1)}
/* intro */
.orbwrap{position:relative;height:250px;margin:4px -22px 0}
.orb{position:absolute;border-radius:50%;filter:blur(2px)}
.orb.a{width:230px;height:230px;left:50%;top:10px;transform:translateX(-58%);background:radial-gradient(circle at 35% 30%,#fff 0%,var(--orb1) 45%,transparent 72%)}
.orb.b{width:170px;height:170px;left:50%;top:60px;transform:translateX(5%);background:radial-gradient(circle at 40% 35%,#fff 0%,var(--orb2) 45%,transparent 72%)}
.orb.c{width:110px;height:110px;left:50%;top:150px;transform:translateX(-95%);background:radial-gradient(circle at 40% 35%,#fff 0%,var(--orb3) 50%,transparent 72%)}
.drop{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:120px;height:120px;border-radius:50% 50% 50% 0;rotate:-45deg;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.25));box-shadow:inset -10px -14px 30px rgba(74,44,92,.12),0 20px 40px rgba(74,44,92,.12);border:1px solid rgba(255,255,255,.7)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .drop{background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.03));border-color:rgba(255,255,255,.12)} }
:root[data-theme="dark"] .drop{background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.03));border-color:rgba(255,255,255,.12)}
.flow3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.flow3 div{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.flow3 b{font-family:"Hahmlet",serif;font-size:18px;color:var(--plum);font-weight:600}
.flow3 span{font-size:12.5px;color:var(--ink2);line-height:1.45}
/* scan */
.stage{position:relative;background:radial-gradient(circle at 50% 40%,var(--lilac),var(--paper) 70%);border:1px solid var(--line);border-radius:26px;aspect-ratio:1/1;max-width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage svg.ov{position:absolute;inset:0;margin:auto;width:72%;height:auto;z-index:2}
.stage video,.stage img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);z-index:1}
.stage.has-photo .ov ellipse{stroke:#fff;stroke-opacity:.9}
.stage.has-photo .smsg{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6);z-index:3}
.cambtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cambtns .btn{font-size:14.5px;padding:13px}
.camnote{font-size:12px;color:var(--muted);font-weight:300}
.stage .pt{opacity:.15;transition:opacity .4s}
.scanning .pt{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}
.ring{transition:stroke-dashoffset 2.1s linear}
.smsg{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:13px;color:var(--ink2);z-index:3}
@media (prefers-reduced-motion:reduce){ .scanning .pt{animation:none;opacity:1} .ring{transition:none} .dots i{transition:none} .opt{transition:none} }
.skins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.skin{display:flex;align-items:center;gap:10px;font:inherit;font-size:13.5px;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.skin i{width:22px;height:22px;border-radius:50%;flex:none}
.skin[aria-pressed="true"]{border-color:var(--plum);background:var(--lilac);font-weight:600}
/* result */
.hello{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.hello p.serif{font-size:21px;line-height:1.5;font-weight:400}
.hello p.serif b{font-weight:700;color:var(--plum)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card .hd{display:flex;justify-content:space-between;align-items:baseline}
.card .hd h3{font-family:"Hahmlet",serif;font-size:18px;font-weight:600}
.radar{display:flex;justify-content:center}
.radar svg{width:100%;max-width:340px;height:auto}
.legend{display:flex;flex-direction:column;gap:9px}
.lg{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;font-size:14px}
.lg i{width:10px;height:10px;border-radius:50%}
.pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.l2{background:var(--lilac);color:var(--plum)}
.pill.l3{background:var(--plum);color:var(--plum-ink)}
.pill.me{background:var(--mint);color:var(--ink)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.tl::before{content:"";position:absolute;left:27px;top:30px;bottom:30px;width:1px;background:var(--line)}
.tl li{display:grid;grid-template-columns:56px 1fr;gap:14px;padding-block:8px;position:relative}
.vessel{width:56px;height:72px;display:flex;align-items:center;justify-content:center;background:var(--app);border-radius:16px;position:relative;z-index:1}
.vessel svg{width:34px;height:auto}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:15px 16px;display:flex;flex-direction:column;gap:6px}
.pcard .k{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:600}
.pcard .k .eff{letter-spacing:0;font-weight:600;font-size:11.5px;padding:2px 9px;border-radius:99px;color:#fff}
.pcard .w{font-size:16.5px;font-weight:600;line-height:1.4}
.pcard .why{font-size:13.5px;color:var(--ink2);font-weight:300;line-height:1.7}
.pcard .ing{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.pcard .ing span{font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink2)}
.pcard.main{border-color:var(--plum);box-shadow:0 10px 30px rgba(74,44,92,.12)}
.skipc{opacity:.5}
.notes{background:var(--warn-bg);color:var(--warn);border-radius:18px;padding:14px 16px;font-size:13.5px}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.tbtitle{font-size:14px;font-weight:600;color:var(--ink2)}
.livecv{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);z-index:2;pointer-events:none}
.stage.mp svg.ov{display:none}
.chk{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:3}
.chk span{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.45);color:rgba(255,255,255,.75)}
.chk span::before{content:'○ '}
.chk span.on{background:#3aa58b;color:#fff}
.chk span.on::before{content:'✓ '}
.stage.mp .smsg{font-size:15px;font-weight:600}
.cmp{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#000;max-width:100%}
.cmp img{display:block;width:100%;height:auto}
.cmp img.ovl{position:absolute;inset:0;width:100%;height:100%}
.cmpbar{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.4);transform:translateX(-1px)}
.cmplab{position:absolute;top:10px;font-size:11.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);padding:2px 9px;border-radius:99px}
.cmplab.l{left:10px} .cmplab.r{right:10px}
.cmpr{width:100%;accent-color:var(--plum)}
.anakey .k3b{background:rgb(176,96,40);border-radius:50%}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{font-size:13px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--mc);color:var(--mc);font-weight:500}
.mchip b{font-weight:700}
.mchip.na{border-color:var(--line);color:var(--muted)}
.mchip.na b{font-weight:400}
.mchip small{font-size:10.5px;margin-left:4px;padding:0 6px;border-radius:99px;background:var(--mc);color:#fff;font-weight:600;vertical-align:1px}
.mdet{display:grid;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.mdet>div{display:grid;grid-template-columns:84px auto;column-gap:10px;row-gap:2px;align-items:baseline}
.mdet span{font-size:13px;color:var(--ink2);font-weight:600}
.mdet b{font-size:14px}
.mdet em{grid-column:2;font-style:normal;font-size:12px;color:var(--muted)}
.anaimg{border-radius:24px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1/1;max-width:100%;background:#000}
.anaimg img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.anakey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2)}
.anakey span{display:inline-flex;align-items:center;gap:6px}
.anakey i{width:12px;height:12px;border-radius:3px;display:inline-block}
.anakey .k1{border:1.5px dashed var(--ink2)} .anakey .k2{background:#8b90a8} .anakey .k3{border:2px solid #c27dff;border-radius:50%} .anakey .k4{border:2px solid #ff4d5e;border-radius:50%} .anakey .k5{background:#ffd600}
.covs{display:flex;flex-direction:column;gap:8px}
.cov{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center;font-size:13.5px}
.cov span{grid-column:1} .cov i{grid-column:2;grid-row:1;height:8px;border-radius:99px;background:var(--plum);display:block;max-width:100%} .cov b{grid-column:3;grid-row:1;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.demo{font-size:11px;color:var(--muted);text-align:center;padding:12px 22px 18px;font-weight:300}
</style>
</head>
<body>


<div class="phone" id="phone">
  <div class="top" id="topbar" hidden>
    <button class="back" id="back" aria-label="이전 화면">‹</button>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>
  <main id="screen" aria-live="polite"></main>
  <div class="demo">프로토타입 · 카메라 대신 예시 피부로 스캔해요 · 제품명은 제품 DB 연결 후 표시</div>
</div>

<script>
(function(){
"use strict";
const C = [
  {k:'hyd', code:'Hydration', nm:'수분', col:'var(--c-hyd)', eff:'보습 · 수분'},
  {k:'calm',code:'Soothing',nm:'진정', col:'var(--c-calm)', eff:'진정 · 장벽'},
  {k:'pig', code:'Pigmentation', nm:'색소', col:'var(--c-pig)', eff:'미백 · 톤'},
  {k:'age', code:'AntiAging', nm:'안티에이징', col:'var(--c-age)', eff:'주름 · 탄력'},
  {k:'seb', code:'SebumAcne', nm:'피지/트러블', col:'var(--c-seb)', eff:'피지 · 트러블 · 모공'}
];
const CN = Object.fromEntries(C.map(c=>[c.k,c]));
const SIG = [
  ['q1dry','Q1 건성','설문'],['q1oily','Q1 지성','설문'],['q2','Q2 민감','설문'],
  ['moisture','수분','스캔'],['oiliness','유분','스캔'],['redness','붉은기','스캔'],['acne','여드름','스캔'],
  ['poresAdj','모공(연령보정)','스캔'],['texture','피부결','스캔'],['spots','잡티','스캔'],['radiance','광채','스캔'],
  ['darkCircles','다크서클','스캔'],['wrinkles','주름','스캔'],['firmness','탄력','스캔'],['pai','눈가노화지수','스캔 합성'],['agePrior','나이 사전값','프로필 나이']
];
const SIGN = Object.fromEntries(SIG.map(s=>[s[0],s[1]]));
const W0 = {
  hyd: {q1dry:.40, moisture:.40, texture:.20},
  calm:{q2:.40, redness:.40, acne:.10, q1dry:.10},
  pig: {spots:.60, radiance:.25, darkCircles:.15},
  age: {wrinkles:.35, firmness:.25, pai:.20, agePrior:.15, texture:.05},
  seb: {acne:.35, q1oily:.30, oiliness:.20, poresAdj:.15}
};
const CFG0 = {mu:75, sd:10, cuts:[25,45,65], prior:.10};
let W = JSON.parse(JSON.stringify(W0)), CFG = JSON.parse(JSON.stringify(CFG0));
const PAI = {upperLid:.4, lowerLid:.3, eyeBags:.3};
const RAMP = [[25,0],[35,.30],[45,.60],[55,.85],[65,1]];
const SCAN = [
  ['수분 · 유분',[['moisture','수분'],['oiliness','유분']]],
  ['붉은기 · 트러블 · 결',[['redness','붉은기'],['acne','여드름'],['pores','모공'],['texture','피부결']]],
  ['색소 · 톤',[['spots','잡티'],['radiance','광채'],['darkCircles','다크서클']]],
  ['노화 · 눈가',[['wrinkles','주름'],['firmness','탄력'],['upperLid','윗눈꺼풀 처짐'],['lowerLid','아랫눈꺼풀 처짐'],['eyeBags','눈밑 지방']]]
];
const clip=(x,a,b)=>Math.max(a,Math.min(b,x));
function ramp(a){ if(a<=RAMP[0][0]) return 0; for(let i=1;i<RAMP.length;i++){const [x0,y0]=RAMP[i-1],[x1,y1]=RAMP[i]; if(a<=x1) return y0+(y1-y0)*(a-x0)/(x1-x0);} return 1; }
function sev(v){ return v==null?null:clip((CFG.mu-v)/(2*CFG.sd),0,1); }

function signals(u){
  const s={}, sc=u.scan;
  const q1={1:[1,0],2:[.5,.5],3:[0,1]}[u.q1];
  s.q1dry=q1?q1[0]:null; s.q1oily=q1?q1[1]:null;
  s.q2={1:1,2:.5,3:0}[u.q2]; if(s.q2===undefined) s.q2=null;
  if(sc){
    ['moisture','oiliness','redness','acne','pores','texture','spots','radiance','wrinkles','firmness','darkCircles'].forEach(k=>s[k]=sev(sc[k]));
    let n=0,d=0; for(const k in PAI){ if(sc[k]!=null){ n+=PAI[k]*sev(sc[k]); d+=PAI[k]; } }
    s.pai=d?n/d:null;
  }
  if(u.age!=null && u.age!==''){
    s.agePrior=ramp(u.age);
  } else s.agePrior=null;
  s.poresAdj = s.pores!=null ? s.pores*(1-0.5*(s.agePrior||0)) : null;
  return s;
}
function mods(u){
  const m={hyd:0,calm:0,pig:0,age:0,seb:0}, w=u.wear;
  if(w){ if(w.sleep!=null){m.hyd+=.08*w.sleep; m.calm+=.04*w.sleep;}
         if(w.inf!=null){m.calm+=.08*w.inf; m.seb+=.04*w.inf;}
         if(w.lut){m.seb+=.05;} }
  for(const k in m) m[k]=Math.min(.10,m[k]);
  return m;
}
function levelOf(c,sc){
  if(sc==null) return null;
  const cuts=CFG.cuts, adj=(c==='calm')?3:0;
  let L=0; cuts.forEach(t=>{ if(sc>=t-adj) L++; }); return L;
}
function score(u){
  const s=signals(u), md=mods(u), out={};
  for(const c in W){
    const ws=W[c]; let tot=0; for(const k in ws) tot+=+ws[k]||0;
    if(tot<=0){ out[c]={score:null,conf:0,level:null,parts:[]}; continue; }
    let conf=0, sum=0; const parts=[];
    for(const k in ws){ const w=(+ws[k]||0)/tot; if(!w) continue;
      if(s[k]!=null){ conf+=w; sum+=w*s[k]; parts.push({k,w,v:s[k],p:w*s[k]*100}); }
      else parts.push({k,w,v:null,p:w*CFG.prior*100,missing:true}); }
    let sc=null;
    conf=Math.min(1,conf); if(conf>0){ const base=Math.max(0,sum+(1-conf)*CFG.prior); sc=Math.round(Math.min(1,base+md[c])*1000)/10; }
    if(md[c]>0) parts.push({k:'_wear',w:null,v:null,p:md[c]*100});
    out[c]={score:sc,conf,level:levelOf(c,sc),parts,mod:md[c]};
  }
  out._s=s; return out;
}
const LVN=['없음','관찰','관리','집중'];
const ORDER=['calm','hyd','seb','pig','age'];

// Q-C 대상: 임신 시 제외해야 하는 성분이 루틴 어디에든 있으면 1회 질문

function basePlan(u,R,capMax,capTag){
  const s=R._s, flags=[];
  const main=u.q5||'hyd';
  const mainWhy='Q5에서 직접 고른 고민입니다. 점수와 관계없이 에센스 메인으로 유지합니다.';

  // 자극 상한
  let cap={1:2,2:3,3:5}[u.q2]||3; const capWhy=[{1:'Q2 ① 자주',2:'Q2 ② 가끔',3:'Q2 ③ 거의 없음'}[u.q2]];
  if(u.age<20 && cap>3){ cap=3; capWhy.push('19세 이하'); }
  if(R.calm.level>=3){ if(cap>2) capWhy.push('진정 집중'); cap=Math.min(cap,2); }
  else if(R.calm.level>=2){ if(cap>3) capWhy.push('진정 관리'); cap=Math.min(cap,3); }
  if(capMax && cap>capMax){ cap=capMax; capWhy.push(capTag); }
  if(cap<5) flags.push(['info','자극 상한',`Irritation_Level ≤ ${cap}. ${capWhy.join(' + ')} 기준입니다.`]);
  const sensitive=cap<=2;

  C.forEach(c=>{ const r=R[c.k];
    if(r.score!=null && r.conf<.5) flags.push(['info','근거 부족',`${c.nm}: 측정 근거가 ${Math.round(r.conf*100)}%라 설문 위주로 판정했습니다. 스캔을 받으면 달라질 수 있습니다.`]);
    if(r.score==null) flags.push(['info','판정 불가',`${c.nm}: 이 고민을 판단할 입력이 없습니다${c.k==='pig'?' (색소는 스캔으로만 판단)':''}.`]);
    else{ const adj=c.k==='calm'?3:0, near=CFG.cuts.map(t=>t-adj).find(t=>Math.abs(r.score-t)<3); if(near!=null) flags.push(['warn','경계',`${c.nm} ${r.score.toFixed(0)}점은 ${near}점 기준${adj?'(진정은 안전측으로 3점 낮춤)':''} ±3 안입니다. 재스캔 평균으로 확인합니다.`]); } });

  const steps=[];
  // 클렌저
  let str={1:3,2:2,3:1}[u.q3]||2; const strN=['','약(약산성)','중','강'];
  if(u.q1==1 && str>1) str--;
  let cl='세안 폼', clIng=[], clWhy=`Q3 ${['','①','②','③'][u.q3]} → 세정력 ${strN[str]}${u.q1==1?' (건성이라 한 단계 하향)':''}`;
  if(sensitive && str>2){ str=2; clWhy+=' · 민감해 세정력 상한 중'; }
  if(R.seb.level>=2){
    const a=s.acne||0, p=s.poresAdj||0, t=s.texture||0;
    if(a>=p && a>=t*0.8){ if(cap<=2){ cl='LHA · 티트리 트러블 폼'; clIng=['LHA','티트리']; clWhy+=' · 피지/트러블 관리 이상, 여드름 신호 우세 (예민해 BHA 대신 LHA)'; } else { cl='BHA 트러블 폼'; clIng=['BHA','티트리']; clWhy+=' · 피지/트러블 관리 이상, 여드름 신호 우세'; } }
    else if(p>=t*0.8){ cl='클레이 클렌저'; clIng=['클레이']; clWhy+=' · 피지/트러블 관리 이상, 모공 신호 우세'; }
    else if(cap<=3){ cl='약산성 젤 클렌저'; clIng=[]; str=1; clWhy+=' · 피부결 신호 우세지만 자극 상한 3 이하라 스크럽 대신 약산성 젤'; }
    else { cl='스크럽 클렌저'; clIng=['스크럽']; clWhy+=' · 피부결 신호 우세'; }
  } else if(R.calm.level>=2 || sensitive){ cl='약산성 진정 젤 클렌저'; clIng=['시카']; str=Math.min(str,1); clWhy+=' · 진정 관리 이상이라 약산성 젤'; }
  steps.push({n:'클렌저',what:cl,ing:clIng,spec:[`세정력 ${strN[str]}`],why:clWhy});

  // 에센스 = Q5 고민
  const ING={
    age:{hi:['레티놀','펩타이드'],lo:['바쿠치올','펩타이드']},
    pig:{hi:['순수 비타민C','나이아신아마이드'],lo:['비타민C 유도체','나이아신아마이드','트라넥삼산']},
    seb:{hi:['BHA','AHA'],lo:cap<=2?['아젤라산','나이아신아마이드']:['LHA','아젤라산','티트리']},
    hyd:{hi:['히알루론산','판테놀'],lo:['히알루론산','판테놀']},
    calm:{hi:['시카','마데카소사이드','판테놀'],lo:['시카','마데카소사이드','판테놀']}
  }[main];
  const strong = cap>=4 && (R[main].level||0)>=2;
  if(cap>=4 && !strong && ING.hi.join()!==ING.lo.join()) flags.push(['info','성분 강도',`${CN[main].nm} 점수가 ${R[main].score==null?'판정 불가':LVN[R[main].level]+' 단계'}라 고기능 성분 대신 순한 성분(${ING.lo[0]})으로 시작합니다.`]);
  const ESS_T={1:'리치한 앰플',2:'세럼',3:'워터리 에센스'}[u.q1]||'세럼';
  const essence={c:main,n:'에센스',what:`${CN[main].eff} ${ESS_T}`,ing:(strong?ING.hi:ING.lo).slice(),spec:[`Key_Efficacy ${CN[main].code}`,`제형 ${ESS_T} (Q1 ${['','①','②','③'][u.q1]})`],why:mainWhy};

  // 분석 고민('관리' 이상) 최대 2개 → 우선순위대로 크림 → 로션(없으면 토너)
  const ageAdj=u.age<30?1:u.age<50?2:3, gAdj=u.gender==='M'?-1:0;
  const TI=clip((+u.q4||2)+ageAdj+gAdj,1,5);
  const TIN=['','산뜻한 젤','라이트','일반','고보습','꾸덕한 영양'], LIN=['','워터리','가벼운','일반','고보습','리치'];
  const tiWhy=`Texture_Index ${TI} = Q4 ${u.q4} + 연령 ${ageAdj}${gAdj?' − 1(남성)':''}`;
  const tType={1:'점도 있는 흡수형',2:'밸런싱',3:'산뜻한 워터'}[u.q1]||'밸런싱';
  const allInOne = u.gender==='M' && TI<=2 && (u.q1==3||u.q4==1) && u.q1!=1;
  const skipLotion = !allInOne && u.gender==='M' && TI<=2 && u.q1!=1;
  let slots=['cream'].concat(allInOne||skipLotion?[]:['lotion']).concat(sensitive?[]:['toner']);
  const MAX_EXTRA=2;
  const rank=ORDER.filter(c=>c!==main && R[c].score!=null && R[c].conf>=.5 && (R[c].level||0)>=2 && !(sensitive&&c==='calm'))
    .sort((a,b)=>(R[b].level-R[a].level)||(R[b].score-R[a].score)||(ORDER.indexOf(a)-ORDER.indexOf(b)));
  const asg={}; slots.forEach((sl,i)=>{ asg[sl]=i<MAX_EXTRA?(rank[i]||null):null; });
  if(sensitive) asg.toner='calm';
  const SLN={cream:allInOne?'올인원 로션':'크림',lotion:'로션',toner:'토너'};
  const leaveIng=(c,slot)=>({
    hyd: slot==='cream' ? (u.q1==1?['세라마이드','판테놀']:['히알루론산','스쿠알란']) : ['히알루론산'],
    calm:['시카','판테놀'],
    pig:['나이아신아마이드','비타민C 유도체'],
    age:(slot==='cream' && cap>=4 && R.age.level>=2)?['레티놀','펩타이드']:['펩타이드','아데노신'],
    seb:(slot==='toner' && cap>=3)?['LHA','나이아신아마이드']:['나이아신아마이드','판테놀']
  })[c];
  const whyOf=(slot)=>{ const c=asg[slot];
    if(slot==='toner' && sensitive) return '민감(자극 상한 2)이라 무알콜 진정 토너로 고정';
    if(!c) return (slots.indexOf(slot)>=MAX_EXTRA && rank.length>=MAX_EXTRA)?'분석 고민은 2개까지 추천해 기본 보습':'추가로 관리할 고민이 없어 기본 보습';
    return `분석 고민 ${slots.indexOf(slot)+1}순위: ${CN[c].nm} ${LVN[R[c].level]} (${R[c].score.toFixed(0)}점)`; };
  const effOf=(slot)=>asg[slot]||'hyd';

  const tc=effOf('toner');
  const toner={c:tc,analytic:!!asg.toner&&!sensitive,n:'토너',what:`${CN[tc].eff} 토너 · ${tType}`,ing:leaveIng(tc,'toner'),spec:[`Key_Efficacy ${CN[tc].code}`].concat(sensitive?['무알콜 · 필링 제외']:[]),why:whyOf('toner')};
  const cc=effOf('cream'), lc=effOf('lotion');
  let lotion, cream;
  if(allInOne){
    lotion={c:cc,analytic:!!asg.cream,n:'로션',what:`올인원 로션 · ${CN[cc].eff} (로션 · 크림 통합)`,ing:leaveIng(cc,'cream'),spec:['Texture_Index 2',`Key_Efficacy ${CN[cc].code}`],why:tiWhy+' · 남성 · 지성 또는 산뜻 선호 · '+whyOf('cream')};
    cream={n:'크림',what:'올인원으로 대체',ing:[],spec:[],why:'올인원 로션이 크림 역할까지 합니다',skip:true};
  } else {

      ? {n:'로션',what:'생략',ing:[],spec:[],why:tiWhy+' · 남성 Index 2 이하는 로션 생략',skip:true}
      : {c:lc,analytic:!!asg.lotion,n:'로션',what:`${LIN[TI]} 로션 · ${CN[lc].eff}`,ing:leaveIng(lc,'lotion'),spec:[`Texture_Index ${TI}`,`Key_Efficacy ${CN[lc].code}`],why:whyOf('lotion')+' · '+tiWhy};
    cream={c:cc,analytic:!!asg.cream,n:'크림',what:`${skipLotion?'라이트':TIN[TI]} 크림 · ${CN[cc].eff}`,ing:leaveIng(cc,'cream'),spec:[`Texture_Index ${TI}`,`Key_Efficacy ${CN[cc].code}`],why:whyOf('cream')+(skipLotion?' · 크림은 생략하지 않습니다':'')};
  }
  steps.push(toner,essence,lotion,cream);

  // 안내: Q5 고민보다 다른 고민이 높을 때 어디서 반영되는지, 자리가 모자라 빠진 고민
  const slotOf=c=>Object.keys(asg).find(k=>asg[k]===c);
  if(R[main].score==null) flags.push(['info','참고',`${CN[main].nm}은 스캔이 없어 점수로 판단할 수 없습니다. Q5 선택대로 에센스를 배정했습니다.`]);
  else if((R[main].level||0)<=1){
    const hi=ORDER.filter(c=>c!==main && R[c].level>=2 && R[c].conf>=.5).sort((a,b)=>R[b].score-R[a].score)[0];
    if(hi){ const sl=slotOf(hi);
      flags.push([R[hi].level>=3?'warn':'info',R[hi].level>=3?'확인':'참고',`고른 고민(${CN[main].nm})은 점수상 ${LVN[R[main].level||0]} 단계이고, ${CN[hi].nm}이 ${LVN[R[hi].level]} 단계입니다. 메인은 유지하고 ${sl?SLN[sl]+'에서 '+CN[hi].nm+'을 반영합니다':'결과 화면에서 '+CN[hi].nm+' 관리를 함께 안내합니다'}.`]); } }
  ORDER.filter(c=>c!==main && R[c].level>=2 && R[c].conf>=.5 && !slotOf(c) && !(sensitive&&c==='calm')).forEach(c=>flags.push(['info','참고',`${CN[c].nm}(${LVN[R[c].level]})은 분석 고민 추천(2개)에서 빠져 결과 화면에서 따로 안내합니다.`]));
  const picks=Object.keys(asg).filter(k=>asg[k] && !(k==='toner'&&sensitive)).map(k=>({c:asg[k],slotName:SLN[k]}));
  const extras=ORDER.filter(c=>c!==main && R[c].level>=2 && R[c].conf>=.5 && !slotOf(c) && !(sensitive&&c==='calm'));
  return {main,steps,flags,cap,meta:{picks,extras,sensitive,TI,minor:u.age<20}};
}

function plan(u,R){
  const base=basePlan(u,R,null,'');
  const need=[...new Set(base.steps.flatMap(st=>st.ing||[]).filter(x=>PREG_OUT.includes(x)))];
  // 전성분 기준: 이름에는 없어도 고른 제품 전성분에 임신·처방약·알레르기 대상이 있으면 질문 (예: 진정 토너 속 버드나무껍질 추출물)
  matchProducts(u,R,Object.assign({},base,{qcUsed:[]})).rows.forEach(r=>{ if(r.pick) r.pick.groups.forEach(g=>{ const G=ING_GROUP[g]; if((G.preg||G.rx||G.alg)&&!need.includes(g)) need.push(g); }); });
  // Q-C · 알레르기 후속은 복수 선택. 해당 규칙을 모두 적용하고, 겹치면 임신 규칙이 우선
  const qcs = need.length ? [].concat(u.qc||[]).filter(x=>x!=='none') : [];
  const qas = [].concat(u.qca||[]);
  let capMax=null; const capTags=[], whys=[], sub={};
  const lower=(c,tag)=>{ capMax=capMax==null?c:Math.min(capMax,c); capTags.push(tag); };
  if(qcs.includes('rx')){ lower(2,'Q-C 처방약'); Object.assign(sub,{'레티놀':SUB_STD['레티놀'],'BHA':SUB_STD['BHA'],'AHA':SUB_STD['AHA'],'스크럽':SUB_STD['스크럽'],'알부틴':'나이아신아마이드','코직산':'나이아신아마이드','레조르시놀':'나이아신아마이드'}); whys.push('피부과 처방약 사용 중'); }
  if(qcs.includes('allergy')){
    if(qas.includes('bha')){ Object.assign(sub,{'BHA':'LHA'}); whys.push('아스피린 · 살리실산 알레르기'); }
    if(qas.includes('ret')){ Object.assign(sub,{'레티놀':'펩타이드','바쿠치올':'펩타이드'}); whys.push('레티놀 계열 알레르기'); }
    if(qas.includes('aha')){ Object.assign(sub,{'AHA':'PHA'}); whys.push('AHA 알레르기'); }
    if(qas.includes('etc')){ lower(3,'Q-C 알레르기(원인 미상)'); whys.push('원인 미상 알레르기'); } }
  const preg=qcs.includes('preg');
  if(preg){ lower(2,'Q-C 임신·수유'); Object.assign(sub,SUB_PREG); whys.push('임신·수유 중'); }
  const P = capMax ? basePlan(u,R,capMax,capTags.join(' + ')) : base;
  const swaps=[];
  P.steps.forEach(st=>{ if(!st.ing) return;
    const hit=st.ing.filter(x=>x in sub);
    if(!hit.length) return;
    if(st.n==='클렌저' && preg){ swaps.push(`클렌저 ${st.what} → 약산성 저자극 폼 (${hit.join(' · ')} 제외)`); st.what='약산성 저자극 폼'; st.ing=st.ing.filter(x=>!(x in sub)); return; }
    hit.forEach(x=>swaps.push(`${st.n} ${x} ${sub[x]?'→ '+sub[x]:'제외'}`));
    st.ing=[...new Set(st.ing.map(x=>x in sub?sub[x]:x).filter(Boolean))];
    if(st.n==='클렌저' && CL_RENAME[st.what]) st.what=CL_RENAME[st.what];
  });
  if(whys.length){
    const capNote=capMax?` 자극 상한을 ${capMax}로 낮췄습니다.`:'';
    const body=swaps.length?swaps.join(', ')+'.':(capMax?`자극 상한 ${capMax} 기준으로 전 단계를 순한 성분으로 다시 배정했습니다.`:'교체할 성분이 없습니다.');
    P.flags.push(['crit','Q-C',`${whys.join(' · ')}: ${body}${swaps.length?capNote:''}${preg?' 제품은 전성분에 걸리는 성분이 없는 같은 고민 제품으로 고릅니다.':''}`]);
  }
  const all=P.steps.flatMap(st=>st.ing||[]);
  if(all.includes('레티놀')) P.flags.push(['info','사용 시간','레티놀은 Usage_Time = PM, 밤 루틴에만 배치합니다.']);
  if(all.includes('AHA')) P.flags.push(['info','자외선','AHA는 햇빛에 민감해질 수 있어 낮에 자외선 차단제 사용을 안내합니다.']);
  P.steps.forEach(st=>{ if(st.ing && st.ing.length) st.spec.push(`성분 ${st.ing.join(' · ')}`); if(!st.skip) st.spec.push(`Irritation ≤ ${P.cap}`); });
  P.qcNeed=need; P.qcUsed=qcs;
  return P;
}

const JS=(w,withB,noB)=>{ const ch=w.replace(/[^가-힣A-Za-z0-9]+$/,'').slice(-1); const code=ch.charCodeAt(0)-0xAC00;
  if(code<0||code>11171) return w+noB; const b=code%28; if(withB==='으로') return w+(b&&b!==8?'으로':'로'); return w+(b?withB:noB); };
const ingLine=ing=>{ const ok=(ing||[]).filter(x=>ING_TXT[x]).slice(0,2); if(!ok.length) return ''; return ok.map(x=>`${JS(x,'은','는')} ${ING_TXT[x]}.`).join(' '); };
const Q=c=>`‘${CON[c]}’`;
const Q4T={1:'산뜻한 사용감',2:'적당한 수분감',3:'촉촉한 사용감'};
const WEIGHT=['','가벼운','가벼운','적당한','보습감 있는','리치한'];
function consumerCopy(u,R,P){
  const m=P.meta, main=P.main, picks=m.picks.slice();
  if(m.sensitive && main!=='calm' && R.calm.level>=2 && R.calm.conf>=.5) picks.push({c:'calm',slotName:'토너'});
  const out={head:'',steps:{},notes:[]};

    ? `가장 신경 쓰는 ${Q(main)}에 맞춰 에센스를 고르고, 피부 분석에서 확인된 ${picks.map(p=>Q(p.c)).join(' · ')} 관리를 ${picks.map(p=>p.slotName).join(' · ')}에 더했어요.`
    : `피부 분석에서 특별히 더 관리할 부분은 보이지 않아, ${Q(main)} 에센스에 기본 보습 루틴으로 구성했어요.`;
  P.steps.forEach(st=>{
    let t='';
    if(st.n==='클렌저'){
      if(/트러블 폼/.test(st.what)) t='피부 분석에서 트러블 신호가 보여 모공 속 피지를 관리하는 트러블 폼을 골랐어요.';
      else if(/클레이/.test(st.what)) t='모공이 눈에 띄는 편이라 피지를 흡착하는 클레이 클렌저를 골랐어요.';
      else if(/^약산성 젤/.test(st.what)){ const q=[].concat(P.qcUsed||[]); t = (q.includes('rx')||q.includes('preg')) ? '피부결이 거친 편이지만 지금은 피부를 편안하게 유지하도록 각질 제거 대신 자극이 적은 약산성 젤 클렌저로 골랐어요.' : '피부결이 거친 편이지만 예민한 피부라 각질 제거 대신 자극이 적은 약산성 젤 클렌저로 골랐어요.'; }
      else if(/스크럽/.test(st.what)) t='피부결이 거친 편이라 각질을 부드럽게 정리하는 클렌저를 골랐어요.';
      else if(/저자극 폼/.test(st.what)) t='임신 중이셔서 자극 걱정이 적은 약산성 저자극 폼으로 골랐어요.';
      else if(/진정 젤/.test(st.what)) t = u.q2==1 ? '피부가 예민한 편이라 자극이 적은 약산성 젤 클렌저로 골랐어요.' : '피부 분석에서 붉은기가 보여 자극이 적은 약산성 젤 클렌저로 골랐어요.';
      else t={1:'뽀득한 세안감을 좋아하셔서 세정력이 좋은 폼을 골랐어요.',2:'개운하지만 당기지 않는 세안감을 원하셔서 적당한 세정력의 폼을 골랐어요.',3:'세안 후 촉촉함을 원하셔서 순한 폼을 골랐어요.'}[u.q3]||'';
      if(u.q1==1 && !/진정 젤|저자극/.test(st.what)) t+=' 건조한 편이라 세정력은 한 단계 낮췄어요.';
    } else if(st.n==='토너'){
      if(m.sensitive){ const q=[].concat(P.qcUsed||[]);
        t = u.q2==1 ? '화장품에 따갑거나 붉어진 경험이 있어 알코올 없는 진정 토너로 피부를 먼저 편안하게 해요.'
          : (q.includes('preg')||q.includes('rx')) ? '피부를 편안하게 유지하도록 알코올 없는 진정 토너로 골랐어요.'
          : '피부 분석에서 붉은기가 보여 알코올 없는 진정 토너로 피부를 먼저 편안하게 해요.'; }
      else if(st.analytic) t=`피부 분석에서 ${JS(Q(st.c),'이','가')} ${JS(LVP[R[st.c].level],'으로')} 나와 토너로 함께 관리해요. `+ingLine(st.ing);
      else t={1:'세안 후 당김이 있어 점도 있는 토너로 수분을 먼저 채워요.',2:'볼과 T존의 유수분 차이를 맞춰 주는 밸런싱 토너예요.',3:'번들거림이 신경 쓰이셔서 산뜻한 워터 토너로 골랐어요.'}[u.q1]||'';
    } else if(st.n==='에센스'){
      t=`가장 시급한 고민으로 ${JS(Q(main),'을','를')} 고르셔서 메인 에센스로 넣었어요. `;
      const r=R[main];

      if(allIn) t+=' 산뜻한 사용감을 좋아하셔서 로션과 크림을 하나로 줄였어요.';

    }

  if(qcs.includes('rx')) out.notes.push('피부과 처방약을 쓰고 계셔서 순한 성분으로만 구성했어요. 처방약은 안내받은 대로 계속 사용해 주세요.');

PRODUCTS.forEach(p=>Object.assign(p,prodInfo(p)));

function exclusionOf(u,P){

    if(qcs.includes('rx')&&G.rx) add(g,'처방약');

    p.hits.forEach(h=>{ if(ex[h.g]) why.push(`${h.inci} (${h.g}${INCI_GRAY[h.inci]?' · 회색지대':''}) — ${ex[h.g].join(' · ')} 제외`); });

  P.steps.forEach(st=>{ if(st.skip){ out.push({st,skip:true}); return; }

/* 피부 고민 지도: 0~100 같은 척도, 기준선 25 · 45 · 65 */
function radar(R){
  const ax=['hyd','calm','pig','age','seb'], cx=150, cy=140, rad=100;
  const pt=(i,v)=>{ const a=-Math.PI/2+i*2*Math.PI/5; return [cx+Math.cos(a)*rad*v/100, cy+Math.sin(a)*rad*v/100]; };
  const ring=v=>ax.map((_,i)=>pt(i,v).join(',')).join(' ');
  let s=`<svg viewBox="-30 0 360 290" role="img" aria-label="피부 고민 지도">`;
  [100,65,45,25].forEach(v=>{ s+=`<polygon points="${ring(v)}" fill="${v===100?'var(--sunk)':'none'}" stroke="var(--line)" stroke-width="1"/>`; });
  ax.forEach((_,i)=>{ const [x,y]=pt(i,100); s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; });
  const vals=ax.map(k=>R[k].score==null?0:R[k].score);
  s+=`<polygon points="${vals.map((v,i)=>pt(i,Math.max(v,3)).join(',')).join(' ')}" fill="var(--plum)" fill-opacity=".16" stroke="var(--plum)" stroke-width="2" stroke-linejoin="round"/>`;
  ax.forEach((k,i)=>{ const [x,y]=pt(i,Math.max(vals[i],3)); s+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${CN[k].col}" stroke="var(--paper)" stroke-width="2"/>`;
    const [lx,ly]=pt(i,122); s+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink2)" font-family="Gothic A1, sans-serif">${CON[k].replace(' · ','·')}</text>`; });
  s+=`<text x="${cx+4}" y="${cy-rad*.45+3}" font-size="9" fill="var(--muted)" font-family="Gothic A1, sans-serif">관리 45</text>`;
  return s+'</svg>';
}

      <p class="note">비율이 낮은 부위는 머리카락 · 그림자 · 안경 등으로 가려진 곳이에요. 이마가 낮게 나오면 앞머리를 넘기고 다시 찍어 주세요.</p></div>
    <div class="card"><div class="hd"><h3>14개 지표</h3><span class="note">측정 ${a.measured} / 14 · 높을수록 좋아요</span></div><div class="mchips">${PHOTO_KEYS.map(k=>{ const x=v[k];
      return `<span class="mchip${x==null?' na':''}" style="--mc:${MCOL[k]}">${METRIC_KO[k]} <b>${x==null?'측정 불가':Math.round(x)}</b>${x!=null&&(a.est||[]).includes(k)?'<small>추정</small>':''}</span>`; }).join('')}</div>
      ${a.detail?`<div class="mdet">
        <div><span>윗눈꺼풀</span><b>${a.detail.mrd1!=null?a.detail.mrd1+' mm':'-'}</b><em>동공 중심 ~ 윗눈꺼풀 거리 · 보통 4~5 mm, 작을수록 처짐</em></div>
        <div><span>아랫눈꺼풀</span><b>${a.detail.show!=null?(a.detail.show>0?'흰자 '+a.detail.show+' mm':'흰자 안 보임'):'-'}</b><em>홍채 아래 흰자가 보이면 아래 눈꺼풀이 늘어진 신호</em></div>
        <div><span>눈밑 지방</span><b>${a.detail.bag!=null?'골 깊이 '+a.detail.bag:'-'}</b><em>볼록한 띠 아래 그림자 골의 진하기(L) · 조명이 정면이면 낮게 나올 수 있어요</em></div>
        <div><span>탄력(추정)</span><b>${a.detail.fold!=null?'팔자 '+a.detail.fold:'-'}</b><em>팔자 주름 그림자와 입꼬리 처짐으로 추정 · 실측 장비 값과 보정 전</em></div>
        <div><span>수분(추정)</span><b>${a.detail.flakes!=null?'각질 '+a.detail.flakes+'곳':'-'}</b><em>각질과 볼 윤기로 추정 · 실측 장비 값과 보정 전</em></div>
        <p class="note">눈꺼풀은 홍채 지름(약 11.7 mm)을 자로 써서 mm로 재요. 추정 지표는 실측의 절반 신뢰도로 반영해요.</p></div>`:''}
      <p class="note">수분 · 탄력 · 눈가 처짐은 사진 한 장으로 판단할 수 없어 측정하지 않았어요. 조명과 카메라에 따라 값이 달라질 수 있는 실험 기능이에요.</p></div>
    <div class="foot"><button class="btn" id="toroutine">내 루틴 보기</button><button class="btn ghost" id="retake">다시 찍기</button></div>`;
}
function resultHTML(){
  const R=score(U), P=plan(U,R), CP=consumerCopy(U,R,P);
  const picks=[...new Set(P.meta.picks.map(p=>p.c))];
  let h=`<div class="hello"><span class="kicker">Your Routine</span><p class="serif">${esc(CP.head).replace(/‘([^’]+)’/g,'<b>‘$1’</b>')}</p></div>`;
  h+=`<div class="card"><div class="hd"><h3>피부 고민 지도</h3><span class="note">바깥일수록 관리가 필요해요</span></div><div class="radar">${radar(R)}</div><div class="legend">`;
  ['hyd','calm','pig','age','seb'].forEach(k=>{ const r=R[k]; const me=k===P.main, an=picks.includes(k);
    const lv=r.score==null?'스캔 필요':LVC[r.level];
    h+=`<div class="lg"><i style="background:${CN[k].col}"></i><span>${esc(CON[k])}${me?' <span class="pill me">내가 고른 고민</span>':an?' <span class="pill l2">분석 고민</span>':''}</span><span class="pill${r.level>=3?' l3':r.level>=2?' l2':''}">${lv}</span></div>`; });
  h+=`</div>${U.scan?'':'<p class="note">스캔 없이 진행해 기미 · 잡티는 판단하지 못했어요.</p>'}</div>`;
  if(U.scan){ const src=U.scanSrc==='photo'?`사진 분석(실험) · 측정 ${U.scanN} / 14`:'예시 피부 값';
    h+=`<details class="card"><summary class="hd" style="cursor:pointer;list-style:none"><h3>스캔 상세</h3><span class="note">${src}</span></summary><div class="legend">${PHOTO_KEYS.map(k=>{ const v=U.scan[k];
      return `<div class="lg" style="grid-template-columns:1fr auto"><span>${METRIC_KO[k]}${(k==='spots'&&U.scanSrc==='photo'&&U.spotN!=null)?` <span class="note">(${U.spotN}곳)</span>`:''}</span><span class="pill${v==null?'':(v<55?' l3':v<65?' l2':'')}">${v==null?'측정 불가':Math.round(v)+'점'}</span></div>`; }).join('')}</div>
      <p class="note">점수는 높을수록 좋아요(평균 약 75). ${U.scanSrc==='photo'?'사진 한 장으로는 수분 · 탄력 · 눈가 처짐을 판단할 수 없어 보통 수준으로 계산했어요. 조명과 카메라에 따라 값이 달라질 수 있는 실험 기능이에요.':'예시 피부의 값이에요.'}</p></details>`; }
  h+=`<div class="hd" style="display:flex;justify-content:space-between;align-items:baseline;padding-top:4px"><h2 style="font-size:22px">나의 5단계 루틴</h2><span class="note">아침 · 저녁 순서대로</span></div><ol class="tl">`;
  P.steps.forEach(st=>{ const col=st.c?CN[st.c].col:null; const why=CP.steps[st.n]||st.why;
    h+=`<li${st.skip?' class="skipc"':''}><div class="vessel">${vessel(st.n, st.skip?null:col)}</div><div class="pcard${st.n==='에센스'?' main':''}"><div class="k">${st.n.toUpperCase()}${st.c&&!st.skip?`<span class="eff" style="background:${col}">${esc(CON[st.c])}</span>`:''}${st.n==='에센스'?'<span class="pill me" style="margin-left:auto">메인</span>':''}</div>
      <div class="w">${esc(st.what)}</div><div class="why">${esc(st.skip?st.why:why)}</div>${(!st.skip&&st.ing&&st.ing.length)?`<div class="ing">${st.ing.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}</div></li>`; });
  h+=`</ol>`;
  if(CP.notes.length) h+=`<div class="notes"><ul>${CP.notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  h+=`<div class="foot"><button class="btn ghost" id="redo">처음부터 다시 하기</button></div>`;
  return h;
}

let stream=null;
let liveTimer=null;
function stopCam(){ if(liveTimer){ clearInterval(liveTimer); liveTimer=null; } if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
let okSince=0;
function setChk(c){ const el=$('chk'); if(!el) return; el.hidden=false; el.querySelectorAll('span').forEach(x=>x.classList.toggle('on',!!c[x.dataset.k])); }
function liveGuide(){ const v=$('vid'), ge=$('guideE'), msg=$('smsg'); if(!v||!ge||!msg) return;
  if(MP.ready && $('live')){ $('stage').classList.add('mp'); const lr=liveFace(v,$('live')); if(!lr) return;
    const fc=frameCheck(v), light=!fc||(fc.meanY>=70&&fc.meanY<=225); let m=lr.msg, good=lr.ok&&light;
    if(lr.ok&&!light) m=fc.meanY<70?'조금 더 밝은 곳으로 가 주세요':'빛이 너무 강해요';
    setChk(Object.assign({light},lr.chk));
    const now=Date.now(); if(good){ if(!okSince) okSince=now; } else okSince=0;
    const prog=okSince?Math.min(1,(now-okSince)/1500):0;
    lr.draw(good?'#3aa58b':lr.ok?'#e0b84a':'rgba(255,255,255,.9)',!good,prog);
    msg.textContent=good?(prog<1?`좋아요! 그대로 계세요 · ${Math.ceil((1-prog)*3)}`:'촬영했어요'):m;
    if(prog>=1){ okSince=0; capture(); }
    return; }
  if(!MP.failed){ msg.textContent='정밀 얼굴 인식을 준비하고 있어요… 잠시만요'; return; }
  const r=frameCheck(v); if(!r) return;
  let t, ok=false;
  if(r.skinFrac<0.4) t='얼굴을 타원 안에 맞춰 주세요';
  else if(r.outFrac>0.55) t='조금 뒤로 물러나 주세요';
  else if(r.meanY<70) t='조금 더 밝은 곳으로 가 주세요';
  else if(r.meanY>225) t='빛이 너무 강해요';
  else { t='좋아요, 지금 촬영하세요'; ok=true; }
  msg.textContent=t; ge.setAttribute('stroke', ok?'#3aa58b':'var(--ink2)'); ge.setAttribute('stroke-opacity', ok?'1':'.5'); ge.setAttribute('stroke-width', ok?'3':'2'); }
function capture(){ const v=$('vid'); if(!stream||!v) return;
  const c=document.createElement('canvas'); c.width=v.videoWidth||640; c.height=v.videoHeight||480; c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  U.photo=c.toDataURL('image/jpeg',.9); stopCam(); render(); }
function afterScan(){ const R=score(U), P=plan(U,R); delete U.qc; delete U.qca; if(P.qcNeed.length) go('qc'); else go('result'); }
function tog(d,v,excl){ if(v===excl) return d.includes(v)?[]:[v]; d=d.filter(x=>x!==excl); return d.includes(v)?d.filter(x=>x!==v):d.concat(v); }

function bind(){
  const on=(id,f)=>{ const e=$(id); if(e) e.onclick=f; };
  on('start',()=>go('profile'));
  const a=$('age'); if(a) a.oninput=()=>{ U.age=+a.value; $('ageo').textContent=a.value; };
  const g=$('gseg'); if(g) g.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; U.gender=b.dataset.v; g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); };
  on('next',()=>go('q1'));
  const o=$('opts'); if(o) o.onclick=e=>{ const b=e.target.closest('.opt'); if(!b) return; const v=b.dataset.v; U[cur]=cur==='q5'?v:+v;
    o.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b)); const nx=STEPS[STEPS.indexOf(cur)+1]; setTimeout(()=>go(nx),220); };
  const sk=$('skins'); if(sk) sk.onclick=e=>{ const b=e.target.closest('.skin'); if(!b) return; scanPick=b.dataset.k; if(U.photo){ delete U.photo; render(); return; } sk.querySelectorAll('.skin').forEach(x=>x.setAttribute('aria-pressed',x===b)); $('doscan').disabled=false; $('doscan').textContent='예시 피부로 스캔 시작'; };
  on('doscan',()=>{ stopCam(); const st=$('stage'); st.classList.add('scanning'); $('smsg').textContent='피부를 분석하고 있어요…'; $('doscan').disabled=true; $('noscan').disabled=true;
    requestAnimationFrame(()=>{ $('ring').style.strokeDashoffset='0'; });
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const t0=Date.now(), wait=reduce?300:2300;
    if(U.photo){ (async()=>{ await loadMP(); if(!MP.ready) return analyzePhoto(U.photo);
        try{ const im=await loadImg(U.photo); const r=MP.img.detect(im); const lm=r&&r.faceLandmarks&&r.faceLandmarks[0];
          return lm?analyzeFace(im,lm):{ok:false,reason:'얼굴을 찾지 못했어요. 정면 얼굴이 잘 보이게 다시 찍어 주세요.'}; }
        catch(e){ return analyzePhoto(U.photo); } })().then(res=>{ setTimeout(()=>{
        if(!res.ok){ st.classList.remove('scanning'); $('ring').style.strokeDashoffset='603'; $('smsg').textContent=res.reason; $('doscan').disabled=false; $('noscan').disabled=false; return; }
        U.scan=res.values; U.scanSrc='photo'; U.scanN=res.measured; U.spotN=res.spotCount; U.ana=res; go('analysis'); }, Math.max(0, wait-(Date.now()-t0))); }); }
    else setTimeout(()=>{ U.scan=Object.assign({},SCANS.find(s=>s[0]===scanPick)[3]); U.scanSrc='example'; afterScan(); }, wait); });
  on('noscan',()=>{ stopCam(); U.scan=null; afterScan(); });
  on('toroutine',()=>afterScan());
  const cr=$('cmpr'); if(cr) cr.oninput=()=>{ $('cmpo').style.clipPath=`inset(0 0 0 ${cr.value}%)`; $('cmpb').style.left=cr.value+'%'; };
  on('retake',()=>{ delete U.photo; delete U.ana; U.scan=null; hist.pop(); cur='scan'; render(); });
  on('photo',()=>{ stopCam(); $('file').click(); });
  const fi=$('file'); if(fi) fi.onchange=()=>{ const f=fi.files&&fi.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ U.photo=rd.result; render(); }; rd.readAsDataURL(f); };
  on('camon',async()=>{
    const v=$('vid'), btn=$('camon');
    if(stream){ capture(); return; }
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('no-media');
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720}},audio:false});
      delete U.photo; const st=$('stage'); st.classList.add('has-photo'); const img=st.querySelector('img.shot'); if(img) img.remove();
      v.srcObject=stream; v.hidden=false; await v.play(); btn.textContent='촬영하기'; $('smsg').textContent=MP.ready?'점선 타원 안에 얼굴을 맞춰 주세요':'정밀 얼굴 인식을 준비하고 있어요… 잠시만요'; okSince=0; liveTimer=setInterval(liveGuide,120);
    }catch(err){ stream=null; const n=(err&&err.name)||'', fp=document.featurePolicy||document.permissionsPolicy;
      const blocked=(fp&&fp.allowsFeature&&!fp.allowsFeature('camera'))||n==='SecurityError'||(err&&err.message==='no-media');
      const m=blocked?'이 화면(웹 미리보기)에서는 실시간 카메라가 막혀 있어요. 사진 찍기로 진행하거나 HTML 파일을 직접 열어 주세요'
        :n==='NotAllowedError'?'카메라 권한이 차단돼 있어요. 주소창 왼쪽 자물쇠(또는 사이트 설정)에서 카메라를 허용한 뒤 다시 눌러 주세요'
        :n==='NotReadableError'||n==='AbortError'?'다른 프로그램(줌 · 팀즈 등)이 카메라를 쓰고 있어요. 그 프로그램을 끄고 다시 눌러 주세요'
        :n==='NotFoundError'||n==='OverconstrainedError'?'연결된 카메라를 찾지 못했어요. 사진 찍기로 진행해 주세요'
        :'카메라를 켜지 못했어요('+(n||'알 수 없는 오류')+'). 사진 찍기로 진행해 주세요';
      $('smsg').textContent=m; console.warn('camera',err); }
  });
  const qo=$('qcopts'); if(qo) qo.onclick=e=>{ const b=e.target.closest('.opt'); if(!b) return; U.qcDraft=tog(U.qcDraft||[],b.dataset.v,'none'); render(); };
  on('qcok',()=>{ U.qc=U.qcDraft||[]; delete U.qcDraft; if(U.qc.includes('allergy')) render(); else go('result'); });
  const qa=$('qaopts'); if(qa) qa.onclick=e=>{ const b=e.target.closest('.opt'); if(!b) return; U.qcaDraft=tog(U.qcaDraft||[],b.dataset.v,null); render(); };
  on('qaok',()=>{ U.qca=U.qcaDraft||[]; delete U.qcaDraft; go('result'); });
  on('redo',()=>{ stopCam(); U={age:32,gender:'F'}; scanPick=null; hist=[]; cur='intro'; render(); });
}
render();
})();
